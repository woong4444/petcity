<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="quick"
       class="quick-menu">

    <!-- 🌟 신규 추가됨: 현재 로그인한 회원 아이디 (JS에서 사용) -->
    <input type="hidden" id="globalLoginMemberId" th:value="${session.loginMember != null ? session.loginMember.memberId : 'guest'}">

    <div class="quick-title">
        Quick Menu
    </div>

    <ul class="quick-list">
        <li>
            <a href="/member/mypage">
                내 정보(반려동물)
            </a>
        </li>

        <li>
            <a href="/board/list?type=FAQ">
                자주 묻는 질문(FAQ)
            </a>
        </li>
    </ul>

    <div class="quick-recent-box">
        <div class="quick-recent-title">
            최근 본 병원
        </div>

        <ul id="quickRecentList"
            class="quick-list recent-list">
        </ul>
    </div>

    <button type="button"
            class="btn-top"
            onclick="window.scrollTo({
                top: 0,
                behavior: 'smooth'
            })">
        맨위로 TOP
    </button>
</aside>

</body>
</html>

<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>일반 회원가입 | PetCity</title>

    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <link rel="stylesheet"
          th:href="@{/css/member/signup.css}">

    <!-- 일반회원 가입 화면 전용 보완 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/member/signup-form.css}">

    <!-- 메인 화면과 동일한 공통 하단 푸터 -->
    <link rel="stylesheet"
          th:href="@{/css/common/footer.css(v='20260730-1')}">

    <script defer
            th:src="@{/js/common/footer.js(v='20260730-1')}"></script>
</head>

<body>

<header th:replace="~{common/head :: head}"></header>

<section class="signup-section">

    <div class="signup-container">

        <!-- 왼쪽 서비스 소개 영역 -->
        <div class="signup-left">

            <img th:src="@{/images/signup.jpg}"
                 class="signup-image"
                 alt="PetCity 회원가입">

            <h2>
                우리 아이를 위한<br>
                동물병원 플랫폼
            </h2>

            <p>
                가까운 병원 찾기부터<br>
                진료기록 관리까지<br>
                PetCity 하나면 충분합니다.
            </p>

            <ul>
                <li>🏥 가까운 동물병원 찾기</li>
                <li>📋 진료기록 관리</li>
                <li>💉 예방접종 일정 관리</li>
                <li>⭐ 병원 리뷰 확인</li>
            </ul>

        </div>

        <!-- 오른쪽 회원가입 입력 영역 -->
        <div class="signup-right">

            <h1>🐾 일반 회원가입</h1>

            <p>
                회원 정보를 입력하여 가입하세요.
            </p>

            <div th:if="${message}"
                 class="alert">

                <span th:text="${message}">
                    회원가입 오류
                </span>

            </div>

            <form th:action="@{/member/signup}"
                  method="post"
                  id="signupForm">

                <!-- 아이디 입력 및 중복 확인 -->
                <div class="form-control">

                    <label for="loginId"
                           class="label">

                        <span class="label-text">
                            아이디
                        </span>

                    </label>

                    <div class="id-check-wrap">

                        <input type="text"
                               id="loginId"
                               name="loginId"
                               class="input"
                               th:value="${oldLoginId}"
                               placeholder="영문 소문자로 시작하는 5~20자"
                               autocomplete="username"
                               minlength="5"
                               maxlength="20"
                               pattern="[a-z][a-z0-9]{4,19}"
                               title="아이디는 영문 소문자로 시작하는 5~20자의 영문 소문자와 숫자만 사용할 수 있습니다."
                               required>

                        <button type="button"
                                id="checkLoginIdBtn"
                                class="check-btn">
                            중복확인
                        </button>

                    </div>

                    <p id="loginIdMessage"
                       class="check-message"></p>

                </div>

                <!-- 비밀번호 입력 및 강도 확인 -->
                <div class="form-control">

                    <label for="password"
                           class="label">

                        <span class="label-text">
                            비밀번호
                        </span>

                    </label>

                    <div class="password-input-wrap">

                        <input type="password"
                               id="password"
                               name="password"
                               class="input"
                               placeholder="영문, 숫자, 특수문자 포함 8자 이상"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="64"
                               required>

                        <button type="button"
                                id="togglePasswordBtn"
                                class="password-toggle-btn">
                            보기
                        </button>

                    </div>

                    <p id="passwordStrengthMessage"
                       class="check-message"></p>

                </div>

                <!-- 비밀번호 확인 -->
                <div class="form-control">

                    <label for="passwordCheck"
                           class="label">

                        <span class="label-text">
                            비밀번호 확인
                        </span>

                    </label>

                    <div class="password-input-wrap">

                        <input type="password"
                               id="passwordCheck"
                               name="passwordConfirm"
                               class="input"
                               placeholder="비밀번호를 다시 입력하세요"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="64"
                               required>

                        <button type="button"
                                id="togglePasswordCheckBtn"
                                class="password-toggle-btn">
                            보기
                        </button>

                    </div>

                    <p id="passwordMatchMessage"
                       class="check-message"></p>

                </div>

                <!-- 닉네임 입력 및 중복 확인 -->
                <div class="form-control">

                    <label for="nickname"
                           class="label">

                        <span class="label-text">
                            닉네임
                        </span>

                    </label>

                    <div class="id-check-wrap">

                        <input type="text"
                               id="nickname"
                               name="nickname"
                               class="input"
                               th:value="${oldNickname}"
                               placeholder="닉네임을 입력하세요"
                               minlength="2"
                               maxlength="20"
                               pattern="[가-힣a-zA-Z0-9_]+"
                               title="닉네임은 2~20자의 한글, 영문, 숫자, 밑줄만 사용할 수 있습니다."
                               required>

                        <button type="button"
                                id="checkNicknameBtn"
                                class="check-btn">
                            중복확인
                        </button>

                    </div>

                    <p id="nicknameMessage"
                       class="check-message"></p>

                </div>

                <!-- 이메일 중복 확인 및 인증 -->
                <div class="form-control">

                    <label for="email"
                           class="label">

                        <span class="label-text">
                            이메일
                        </span>

                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="input"
                           maxlength="254"
                           autocomplete="email"
                           placeholder="example@email.com"
                           th:value="${emailVerified
                               ? verifiedEmail
                               : ''}"
                           th:readonly="${emailVerified}"
                           required>

                    <p id="emailActivationMessage"
                       class="check-message"
                       th:classappend="${emailVerified
                           ? ' text-success'
                           : ' text-error'}"
                       th:text="${emailVerified
                           ? '이메일 인증이 완료되었습니다.'
                           : '아이디·비밀번호·닉네임 조건을 먼저 완료해주세요.'}">

                        아이디·비밀번호·닉네임 조건을 먼저 완료해주세요.

                    </p>

                    <button type="button"
                            id="checkEmailBtn"
                            class="check-btn"
                            style="margin-top: 10px;"
                            th:disabled="${emailVerified}">
                        이메일 중복확인
                    </button>

                    <p id="emailDuplicateMessage"
                       class="check-message"></p>

                    <div class="email-action-wrap">

                        <button type="button"
                                id="sendEmailCodeBtn"
                                class="check-btn"
                                th:disabled="${emailVerified}"
                                th:classappend="${emailVerified
                                    ? ' is-complete'
                                    : ''}"
                                th:text="${emailVerified
                                    ? '인증 완료'
                                    : '인증번호 발송'}">
                            인증번호 발송
                        </button>

                        <input type="text"
                               id="emailCode"
                               class="input"
                               placeholder="인증번호 6자리"
                               inputmode="numeric"
                               autocomplete="one-time-code"
                               pattern="[0-9]{6}"
                               maxlength="6"
                               disabled>

                    </div>

                    <button type="button"
                            id="resendEmailCodeBtn"
                            class="check-btn resend-email-btn">
                        인증번호 재발송
                    </button>

                    <p id="emailVerificationMessage"
                       class="check-message"
                       th:classappend="${emailVerified
                           ? ' text-success'
                           : ''}"
                       th:text="${emailVerified
                           ? '이미 인증이 완료된 이메일입니다.'
                           : ''}">
                    </p>

                </div>

                <!-- 전화번호 -->
                <div class="form-control">

                    <label for="phone"
                           class="label">

                        <span class="label-text">
                            전화번호
                        </span>

                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           class="input"
                           th:value="${oldPhone}"
                           inputmode="tel"
                           autocomplete="tel"
                           maxlength="13"
                           pattern="01[016789]-?[0-9]{3,4}-?[0-9]{4}"
                           title="휴대전화 번호를 010-0000-0000 형식으로 입력해주세요."
                           placeholder="010-0000-0000"
                           required>

                </div>

                <button type="submit"
                        class="normal-btn">
                    회원가입
                </button>

            </form>

            <div class="divider">
                <span>또는</span>
            </div>

            <!-- SNS 회원가입 -->
            <a th:href="@{/oauth2/authorization/google}"
               class="sns-btn google">
                Google로 시작하기
            </a>

            <a th:href="@{/oauth2/authorization/kakao}"
               class="sns-btn kakao">
                Kakao로 시작하기
            </a>

            <a th:href="@{/oauth2/authorization/naver}"
               class="sns-btn naver">
                NAVER로 시작하기
            </a>

            <div class="login-link">

                이미 회원이신가요?

                <a th:href="@{/member/login}">
                    로그인
                </a>

            </div>

        </div>

    </div>

</section>

<!-- 이메일 인증 여부를 외부 자바스크립트에 전달 -->
<!-- ================= 공통 하단 푸터 ================= -->
<div th:replace="~{common/footer :: footer}"></div>

<script th:inline="javascript">
    const serverEmailVerified =
        /*[[${emailVerified}]]*/ false;

    const serverVerifiedEmail =
        /*[[${verifiedEmail}]]*/ "";
</script>

<!-- 일반회원 가입 입력 검증 및 이메일 인증 기능 -->
<script th:src="@{/js/member/signup-form.js}"></script>

</body>
</html>

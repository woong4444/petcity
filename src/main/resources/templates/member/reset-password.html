<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>새 비밀번호 설정 | PetCity</title>

    <!-- 07-22 상각 : 공통 헤더 CSS 적용 -->
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <!-- reset-password.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/reset-password.css}">
</head>
<body>

<!-- 07-22 상각 : 로그인 페이지와 동일한 공통 헤더 적용 -->
<header th:replace="~{common/head :: head}"></header>

<main class="box">
    <h1>새 비밀번호 설정</h1>

    <p>
        인증은 10분 동안 유효합니다.
        영문·숫자·특수문자를 포함한 8자 이상의 비밀번호를 입력해주세요.
    </p>

    <div th:if="${message}"
         class="msg"
         th:text="${message}">
    </div>

    <form method="post" action="/member/reset-password">

        <label>새 비밀번호</label>
        <input type="password"
               name="newPassword"
               minlength="8"
               autocomplete="new-password"
               required>

        <label>새 비밀번호 확인</label>
        <input type="password"
               name="newPasswordConfirm"
               minlength="8"
               autocomplete="new-password"
               required>

        <button>비밀번호 변경</button>

    </form>
</main>

</body>
</html>

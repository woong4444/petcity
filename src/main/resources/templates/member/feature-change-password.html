<!-- 상각_07-19: 팀장 원본 마이페이지를 변경하지 않는 일반회원 비밀번호 변경 화면 -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>비밀번호 변경 | PetCity</title>

    <!-- ======================================= -->
    <!-- 07-22 상각 : 공통 헤더 CSS 적용 -->
    <!-- ======================================= -->
    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <!-- feature-change-password.html 페이지 전용 스타일 -->
    <link rel="stylesheet"
          th:href="@{/css/member/pages/feature-change-password.css}">

    <!-- 공통 후터 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common/footer.css(v='20260730-1')}">

    <!-- 공통 후터 JS -->
    <script defer
            th:src="@{/js/common/footer.js(v='20260730-1')}"></script>
</head>

<body>

<!-- ======================================= -->
<!-- 07-22 상각 : 공통 헤더 적용 -->
<!-- ======================================= -->
<header th:replace="~{common/head :: head}"></header>

<main class="box">

    <h1>비밀번호 변경</h1>

    <p>
        8자 이상이며 영문·숫자·특수문자를 모두 포함해주세요.
    </p>

    <p th:if="${message}"
       class="msg"
       th:text="${message}">
    </p>

    <form method="post"
          action="/member/feature/password">

        <label for="currentPassword">
            현재 비밀번호
        </label>

        <input id="currentPassword"
               type="password"
               name="currentPassword"
               autocomplete="current-password"
               required>

        <label for="newPassword">
            새 비밀번호
        </label>

        <input id="newPassword"
               type="password"
               name="newPassword"
               autocomplete="new-password"
               required>

        <label for="newPasswordConfirm">
            새 비밀번호 확인
        </label>

        <input id="newPasswordConfirm"
               type="password"
               name="newPasswordConfirm"
               autocomplete="new-password"
               required>

        <button type="submit">
            비밀번호 변경
        </button>

    </form>

</main>

<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>

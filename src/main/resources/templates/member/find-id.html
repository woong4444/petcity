<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>아이디 찾기 | PetCity</title>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <!-- find-id.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/find-id.css}">
</head>
<body>
<header th:replace="~{common/head :: head}"></header>
<main class="box"><h1>아이디 찾기</h1>
    <p>일반 회원가입 때 등록한 이메일을 입력해주세요.<br>SNS 회원의 아이디는 해당 SNS 이메일 계정입니다.</p>
    <div th:if="${message}" class="msg" th:text="${message}"></div>
    <div th:if="${foundLoginId}" class="msg result">회원님의 아이디는 <strong th:text="${foundLoginId}"></strong> 입니다.</div>
    <form method="post" action="/member/find-id"><label>가입 이메일</label><input type="email" name="email" required>
        <button>아이디 찾기</button>
    </form>
    <div class="links"><a href="/member/login">로그인으로 돌아가기</a></div>
</main>
</body>
</html>

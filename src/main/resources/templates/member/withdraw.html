<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>회원 탈퇴 | PetCity</title>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <!-- withdraw.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/withdraw.css}">
</head>
<body>
<header th:replace="~{common/head :: head}"></header>
<main class="box"><h1>회원 탈퇴</h1>
    <div class="warn">탈퇴 요청 즉시 로그아웃되며, 3일 후 계정이 완전히 삭제됩니다. 삭제되기 전까지 탈퇴 취소 및 복구를 신청해주세요.</div>
    <div th:if="${withdrawMessage}" class="msg" th:text="${withdrawMessage}"></div>
    <form method="post" action="/member/mypage/withdraw"
          class="withdraw-confirm-form"
          data-confirm-message="탈퇴를 요청하시겠습니까?"><label>탈퇴
        사유</label><textarea name="deleteReason" minlength="5" maxlength="500" required></textarea>
        <div th:if="${member.loginType == null || member.loginType == 'LOCAL'}"><label>현재 비밀번호</label><input
                type="password" name="password" autocomplete="current-password" required></div>
        <div class="buttons"><a class="cancel" href="/member/mypage">취소</a>
            <button class="submit">탈퇴 요청</button>
        </div>
    </form>
</main>
<script th:src="@{/js/member/withdraw-confirm.js}"></script>
</body>
</html>

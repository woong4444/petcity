<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>비밀번호 변경 | PetCity</title>

    <!-- 공통 헤더 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <!-- change-password.html 페이지 전용 스타일 -->
    <link rel="stylesheet"
          th:href="@{/css/member/pages/change-password.css}">

    <!-- 공통 후터 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common/footer.css(v='20260730-1')}">

    <!-- 공통 후터 JS -->
    <script defer
            th:src="@{/js/common/footer.js(v='20260730-1')}"></script>
</head>

<body>

<header th:replace="~{common/head :: head}"></header>

<main class="box">

    <h1>비밀번호 변경</h1>

    <p>
        8자 이상, 영문·숫자·특수문자를 모두 포함해주세요.
    </p>

    <div th:if="${message}"
         class="msg"
         th:text="${message}">
    </div>

    <div th:if="${successMessage}"
         class="msg ok"
         th:text="${successMessage}">
    </div>

    <form method="post"
          action="/member/mypage/password">

        <label for="currentPassword">
            현재 비밀번호
        </label>

        <input id="currentPassword"
               type="password"
               name="currentPassword"
               autocomplete="current-password"
               required>

        <label for="newPassword">
            새 비밀번호
        </label>

        <input id="newPassword"
               type="password"
               name="newPassword"
               autocomplete="new-password"
               minlength="8"
               required>

        <label for="newPasswordConfirm">
            새 비밀번호 확인
        </label>

        <input id="newPasswordConfirm"
               type="password"
               name="newPasswordConfirm"
               autocomplete="new-password"
               minlength="8"
               required>

        <button type="submit">
            비밀번호 변경
        </button>

    </form>

</main>

<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>

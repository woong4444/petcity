<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이미 가입된 계정 | PetCity</title>
    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">
    <!-- feature-already-sns-member.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/feature-already-sns-member.css}">
</head>
<body>
<header th:replace="~{common/head :: head}"></header>

<div class="already-sns-page">
    <main class="card">
        <!-- 상각_07-19: 기존 SNS 회원의 중복 회원가입 방지 안내 -->
        <h1>이미 가입된 SNS 계정입니다</h1>

        <div class="notice">
            해당 SNS 계정은 이미 PetCity 회원으로 등록되어 있습니다.
        </div>

        <p>
            새로 가입할 필요 없이 로그인 페이지에서 같은 SNS 계정으로 로그인해 주세요.
        </p>

        <div class="actions">
            <a class="login"
               th:href="@{/member/login}">
                로그인 페이지로
            </a>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Pets | PetCity</title>

    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <link rel="stylesheet"
          th:href="@{/css/member/mypage.css}">

    <!-- 회원 반려동물 관리 화면 전용 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/member/pets.css}">
</head>

<body>

<header th:replace="~{common/head :: head}"></header>

<div class="pet-layout-wrapper"
     th:classappend="${mypageLayout} ? ' mypage-shell' : ' pet-standalone-layout'">

    <!-- 마이페이지에서 접근한 경우에만 사이드바 표시 -->
    <aside class="mypage-sidebar"
           th:if="${mypageLayout}">

        <nav class="mypage-nav">

            <a class="sidebar-item"
               th:href="@{/member/mypage}">
                <span class="sidebar-icon">♙</span>
                <span>마이페이지</span>
            </a>

            <a class="sidebar-item active"
               th:href="@{/member/mypage/pets}">
                <span class="sidebar-icon">🐾</span>
                <span>내 반려동물</span>
            </a>

            <a class="sidebar-item"
               th:href="@{/owner/status(mypage=true)}">
                <span class="sidebar-icon">☏</span>
                <span>병원장 문의</span>
            </a>

            <a class="sidebar-item"
               th:if="${session.loginMember.loginType == null
                   or session.loginMember.loginType == 'LOCAL'}"
               th:href="@{/member/mypage/info}">
                <span class="sidebar-icon">↗</span>
                <span>회원정보 수정</span>
            </a>

            <a class="sidebar-item"
               th:if="${session.loginMember.loginType != null
                   and session.loginMember.loginType != 'LOCAL'}"
               th:href="@{/member/feature/mypage/info}">
                <span class="sidebar-icon">↗</span>
                <span>회원정보 수정</span>
            </a>

        </nav>

        <a class="sidebar-logout"
           th:href="@{/member/logout}">
            <span>로그아웃</span>
            <span>↪</span>
        </a>

        <div class="membership-card">
            <strong>
                PetCity<br>
                멤버십 혜택
            </strong>

            <p>향후 서비스 예정</p>

            <span class="membership-dog">🐕</span>
        </div>

    </aside>

    <main class="pet-page"
          th:classappend="${mypageLayout}
              ? ' mypage-main pet-page-mypage'
              : ' pet-page-standalone'">

        <!-- 페이지 제목 -->
        <div class="pet-page-title">

            <div>
                <h1>🐾 내 반려동물</h1>

                <p>
                    반려동물 정보를 등록하고 관리하세요.
                </p>
            </div>

            <a th:href="@{/member/mypage}">
                ← 마이페이지
            </a>

        </div>

        <!-- 등록된 반려동물 목록 -->
        <section class="pet-list"
                 th:if="${!#lists.isEmpty(petList)}">

            <article class="pet-card"
                     th:each="pet : ${petList}">

                <img th:if="${pet.photoUrl}"
                     th:src="${pet.photoUrl}"
                     alt="반려동물 사진">

                <div class="pet-image"
                     th:unless="${pet.photoUrl}">
                    🐾
                </div>

                <div class="pet-info">

                    <h2 th:text="${pet.petName}">
                        반려동물 이름
                    </h2>

                    <p>
                        <b th:text="${pet.animalName}">
                            종류
                        </b>

                        <span th:text="${pet.breedName}">
                            품종
                        </span>
                    </p>

                    <p th:text="${pet.birthDate}
                        + ' / '
                        + ${pet.weight}
                        + 'kg'">
                        반려동물 정보
                    </p>

                </div>

                <div class="pet-action-buttons">

                    <button type="button"
                            class="edit-btn"
                            th:attr="
                                data-id=${pet.petId},
                                data-name=${pet.petName},
                                data-animal=${pet.animalId},
                                data-breed=${pet.breedName},
                                data-gender=${pet.gender},
                                data-birth=${pet.birthDate},
                                data-weight=${pet.weight},
                                data-reg=${pet.registrationNo}
                            "
                            onclick="loadPet(this)">
                        수정
                    </button>

                    <form class="pet-delete-form">

                        <input type="hidden"
                               name="petId"
                               th:value="${pet.petId}">

                        <button type="submit"
                                class="delete-btn">
                            삭제
                        </button>

                    </form>

                </div>

            </article>

        </section>

        <!-- 등록된 반려동물이 없을 때 -->
        <div class="empty-pet"
             th:if="${#lists.isEmpty(petList)}">

            등록된 반려동물이 없습니다.
            아래 입력란에서 반려동물을 등록해 보세요.

        </div>

        <!-- 반려동물 등록 및 수정 폼 -->
        <section class="pet-form-card"
                 id="petFormCard">

            <div class="form-title">

                <h2 id="formTitle">
                    반려동물 등록
                </h2>

                <button type="button"
                        onclick="resetForm()"
                        class="reset-btn"
                        th:disabled="${petList.size() >= 4}">
                    새로 등록
                </button>

            </div>

            <p class="pet-limit-guide">
                반려동물은 최대 4마리까지 등록할 수 있습니다.
                등록된 반려동물은 등록 제한과 관계없이 수정할 수 있습니다.
            </p>

            <form id="petForm"
                  enctype="multipart/form-data">

                <input type="hidden"
                       name="petId"
                       id="petId"
                       value="0">

                <div class="form-grid">

                    <label>
                        이름

                        <input name="petName"
                               id="petName"
                               required
                               maxlength="30"
                               placeholder="반려동물 이름을 입력하세요">
                    </label>

                    <label>
                        종류

                        <select name="animalId"
                                id="animalId"
                                required
                                onchange="fillBreeds()">

                            <option value="">
                                선택
                            </option>

                            <option th:each="animal : ${animalTypeList}"
                                    th:value="${animal.animalId}"
                                    th:text="${animal.animalName}">
                                종류
                            </option>

                        </select>
                    </label>

                    <label>
                        품종

                        <select name="breedName"
                                id="breedName"
                                required>

                            <option value="">
                                종류를 먼저 선택하세요
                            </option>

                        </select>
                    </label>

                    <label>
                        성별 / 중성화

                        <select name="gender"
                                id="gender"
                                required>

                            <option value="M">
                                수컷
                            </option>

                            <option value="F">
                                암컷
                            </option>

                            <option value="NM">
                                중성화 수컷
                            </option>

                            <option value="NF">
                                중성화 암컷
                            </option>

                        </select>
                    </label>

                    <!-- 오늘 이후의 생년월일은 화면과 서버에서 모두 차단 -->
                    <label>
                        생년월일

                        <input type="date"
                               name="birthDate"
                               id="birthDate"
                               required>

                        <span class="input-guide">
                            오늘 이후 날짜는 입력할 수 없습니다.
                        </span>
                    </label>

                    <!-- 모든 반려동물의 몸무게를 0.1~100kg 범위로 제한 -->
                    <label>
                        몸무게(kg)

                        <input type="number"
                               name="weight"
                               id="weight"
                               min="0.1"
                               max="100"
                               step="0.1"
                               required
                               placeholder="0.1~100">

                        <span class="input-guide">
                            종류와 관계없이 0.1kg 이상
                            100kg 이하로 입력해 주세요.
                        </span>
                    </label>

                    <label>
                        등록번호 (선택)

                        <input name="registrationNo"
                               id="registrationNo"
                               maxlength="15"
                               placeholder="최대 15자리">
                    </label>

                    <!-- 이미지 형식과 크기는 자바스크립트와 서버에서 검증 -->
                    <label>
                        사진 (선택)

                        <input type="file"
                               name="file"
                               id="petPhoto"
                               accept=".jpg,.jpeg,.png,.webp">

                        <span class="input-guide">
                            JPG, JPEG, PNG, WEBP 형식만 등록할 수 있으며
                            최대 용량은 5MB입니다.
                        </span>
                    </label>

                </div>

                <p id="saveMessage"
                   class="save-message"></p>

                <button type="submit"
                        class="save-btn"
                        id="saveBtn">
                    반려동물 저장
                </button>

            </form>

        </section>

    </main>

</div>

<!-- Thymeleaf 서버 값을 외부 자바스크립트에서 사용할 수 있도록 전달 -->
<script th:inline="javascript">
    const subAnimals =
        /*[[${subAnimalTypeList}]]*/ [];

    const petCount =
        /*[[${petList.size()}]]*/ 0;

    const maxPetCount = 4;

    const editPetId =
        /*[[${param.editPetId != null
            ? param.editPetId[0]
            : ''}]]*/ '';

    const returnTo =
        /*[[${param.returnTo != null
            ? param.returnTo[0]
            : ''}]]*/ '';
</script>

<!-- 반려동물 등록·수정·삭제 및 입력 검증 기능 -->
<script th:src="@{/js/member/pets.js}"></script>

</body>
</html>

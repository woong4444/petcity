<!-- 상각_07-19: 복구코드 재발급 완료 안내 화면 -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>복구코드 재발급 완료 | PetCity</title>

    <!-- 07-22 상각 : 공통 헤더 CSS 적용 -->
    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <!-- recovery-code-email-complete.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/recovery-code-email-complete.css}">
</head>

<body>

<!-- 07-22 상각 : 로그인 페이지와 동일한 공통 헤더 적용 -->
<th:block th:replace="~{common/head :: head}"></th:block>

<div class="page">

    <main class="card">

        <div class="icon">
            ✓
        </div>

        <h1>새 복구코드 발송 완료</h1>

        <div class="msg">

            등록된 이메일로 새 복구코드를 발송했습니다.<br>

            기존 복구코드는 더 이상 사용할 수 없습니다.

        </div>

        <a class="button"
           th:href="${snsRecovery == true ? '/member/recovery?type=sns' : '/member/recovery?type=local'}">

            탈퇴 취소 요청하기

        </a>

    </main>

</div>

</body>
</html>

<!-- 상각_07-19: 8080 독립 탈퇴 취소 및 계정 복구 화면 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>탈퇴 취소 및 계정 복구 | PetCity</title>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <!-- recovery.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/recovery.css}">
    <link rel="stylesheet"
          th:href="@{/css/common/footer.css(v='20260730-1')}">
    <script defer
            th:src="@{/js/common/footer.js(v='20260730-1')}"></script>
</head>
<body>
<header th:replace="~{common/head :: head}"></header>
<main class="box">
    <h1>탈퇴 취소 및 계정 복구</h1>
    <p id="snsNote" class="note" th:hidden="${!snsRecovery}">SNS에 등록된 이메일과 복구코드가 일치하면 즉시 복구됩니다.</p>
    <p id="localNote" class="note" th:hidden="${snsRecovery}">등록된 이메일과 복구코드가 일치하면 즉시 복구됩니다.</p>
    <div th:if="${message}" class="msg" th:text="${message}"></div>
    <div th:if="${successMessage}" class="note" th:text="${successMessage}"></div>
    <!-- 상각_07-19: 이메일 인증이 끝난 SNS 회원에게 복구코드 수신 주소만 읽기 전용 안내 -->
    <p th:if="${verifiedEmailRecovery}" class="note">
        복구코드 발송 이메일: <strong th:text="${prefillLoginId}"></strong>
    </p>

    <form method="post" action="/member/recovery">
        <!-- 상각_07-19: 복구 실패 후에도 SNS 전용 분기를 유지하기 위한 화면 유형 -->
        <input id="accountType" type="hidden" name="accountType" th:value="${snsRecovery ? 'sns' : 'local'}">
        <label id="loginIdLabel" th:hidden="${verifiedEmailRecovery}"
               th:text="${snsRecovery ? 'SNS 등록 이메일' : '등록 이메일'}">등록 이메일</label>
        <input id="loginId" name="loginId" th:hidden="${verifiedEmailRecovery}" th:value="${prefillLoginId}"
               th:placeholder="${snsRecovery ? 'SNS 가입에 사용한 이메일 주소' : '가입 시 등록한 이메일 주소'}"
               autocomplete="username" required>
        <p id="snsHelp" class="help" th:hidden="${verifiedEmailRecovery or !snsRecovery}">Google·Kakao·Naver 가입에 사용한 이메일
            주소를 입력해주세요.</p>

        <label>복구코드</label>
        <input name="recoveryCode" maxlength="12" autocomplete="off" required>
        <button>탈퇴 취소하고 계정 복구하기</button>
    </form>
    <p class="email-link"><a id="recoveryEmailLink"
                             th:href="${snsRecovery ? '/member/recovery-code-email?type=sns' : '/member/recovery-code-email?type=local'}">복구코드를
        모르시나요? 이메일로 새 코드 받기</a></p>
</main>
<script th:inline="javascript">
    // Thymeleaf 서버 상태만 외부 자바스크립트에 전달합니다.
    window.petcityRecovery = {
        initialSns: /*[[${snsRecovery}]]*/ false,
        verifiedEmailRecovery: /*[[${verifiedEmailRecovery}]]*/ false
    };
</script>
<script th:src="@{/js/member/recovery.js}"></script>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>

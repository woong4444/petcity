<!-- 상각_07-19: 8080 독립 탈퇴 완료 및 복구코드 안내 화면 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>탈퇴 접수 완료 | PetCity</title>

    <!-- 07-22 상각 : 공통 헤더 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common/head.css}">

    <!-- withdrawal-complete.html 페이지 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/pages/withdrawal-complete.css}">
    <link rel="stylesheet"
          th:href="@{/css/common/footer.css(v='20260730-1')}">
    <script defer
            th:src="@{/js/common/footer.js(v='20260730-1')}"></script>
</head>

<body>

<!-- 07-22 상각 : 공통 헤더 -->
<th:block th:replace="~{common/head :: head}"></th:block>

<div class="page">

    <main class="box">

        <h1>탈퇴 요청이 접수되었습니다</h1>

        <p>
            탈퇴 대기 상태로 전환되었습니다.<br>
            3일 후 계정이 완전히 삭제되며,
            삭제 전까지 복구를 신청할 수 있습니다.
        </p>

        <div th:if="${recoveryCode != null}"
             class="code"
             th:text="${recoveryCode}">
        </div>

        <p th:if="${recoveryCode != null}"
           class="code-guide">
            위 복구코드는 이 화면에서 한 번만 표시됩니다.<br>
            지금 복사하거나 안전한 곳에 보관해 주세요.
        </p>

        <p th:if="${recoveryCode == null}"
           class="warn">
            복구코드는 탈퇴 직후에만 표시됩니다.
        </p>

        <div class="links">

            <a th:href="${snsMember == true ? '/member/recovery?type=sns' : '/member/recovery?type=local'}">
                탈퇴 취소 및 복구 신청
            </a>

        </div>

    </main>

</div>

<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
